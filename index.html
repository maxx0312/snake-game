<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇 · Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrap">
    <h1 class="title">🐍 贪吃蛇</h1>

    <header class="scoreboard">
      <div class="score-item">
        <span class="label">分数</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="score-item">
        <span class="label">最高分</span>
        <span id="high-score" class="value">0</span>
      </div>
      <div class="score-item">
        <span class="label">速度</span>
        <span id="level" class="value">1</span>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>
      <div id="overlay" class="overlay hidden">
        <p id="overlay-title" class="overlay-title">暂停</p>
        <p id="overlay-hint" class="overlay-hint"></p>
      </div>
    </div>

    <div class="controls" aria-label="方向控制">
      <div class="controls-row">
        <button class="btn up" data-dir="up" aria-label="上">▲</button>
      </div>
      <div class="controls-row">
        <button class="btn left" data-dir="left" aria-label="左">◀</button>
        <button class="btn down" data-dir="down" aria-label="下">▼</button>
        <button class="btn right" data-dir="right" aria-label="右">▶</button>
      </div>
    </div>

    <p class="tips">方向键 / WASD 移动 · 空格暂停 · 回车开始</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
